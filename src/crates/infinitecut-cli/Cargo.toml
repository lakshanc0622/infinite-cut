[package]
name = "infinitecut-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the Infinite Cut engine."

# `infinitecut` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "infinitecut-cli"
path = "src/main.rs"

[dependencies]
infinitecut-core.workspace = true
infinitecut-media.workspace = true
infinitecut-render.workspace = true
# The `api` command: the Infinite Cut API over stdin and stdout. The `serve`
# command: the same on a socket.
infinitecut-api.workspace = true
infinitecut-server.workspace = true
serde_json.workspace = true
# `preview` draws one effect's card, as the window does; `check` loads
# packages and runs their probes.
infinitecut-effects.workspace = true
infinitecut-host.workspace = true
clap.workspace = true

[features]
# `serve --grpc`. Off by default; see infinitecut-server.
grpc = ["infinitecut-server/grpc"]

[lints]
workspace = true
